# Mock Prometheus 场景（基础骨架；完整异常植入由 mock 生成器扩展）。
hosts: 180
seed: 20260101
history: 6h
step: 60s
live_interval: 30s
missing_label_fraction: 0.05
labels:
  env: [prod, staging]
  role: [app, db, cache, web]
  biz: [pay, order, user, search]
  dc: [bj1, sh1, gz1]
  owner: [ops-a, ops-b, ops-c]
# 与 node_exporter 同机的其他 exporter 数量（优先分配给对应角色的主机）
mysql_hosts: 24
redis_hosts: 12
nginx_hosts: 16
unknown_exporter_hosts: 3
unknown_job: legacy-billing
